spring:
  datasource:
    url: jdbc:h2:file:./.local-data/socialanalytics;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    uris: http://localhost:9200

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    admin-emails: ${APP_ADMIN_EMAILS:analyst@example.com}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://*:5173,http://localhost:63342,http://127.0.0.1:63342,http://*:63342,http://localhost:8080}
    public-docs-enabled: true
  kafka:
    enabled: false
  redis:
    enabled: false
  elasticsearch:
    enabled: false
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://*:5173,http://localhost:63342,http://127.0.0.1:63342,http://*:63342,http://localhost:8080}
