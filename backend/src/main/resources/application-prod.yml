spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  security:
    jwt-secret: ${JWT_SECRET}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS}
